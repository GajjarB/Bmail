[package]
name = "bmail-desktop"
version = "0.2.2"
edition = "2021"
rust-version = "1.77"
description = "Desktop shell for Bmail, a local-first email triage engine"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-updater = { version = "2", optional = true }

[features]
# Built into release installers only when the project has an update-signing
# key: an updater that cannot verify what it downloads must not exist at all.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
strip = true
lto = true
opt-level = "s"
