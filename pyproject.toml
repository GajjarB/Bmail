[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmail"
version = "0.2.2"
description = "Local-first email triage engine: filters, extracts and tracks lifecycle mail without sending anything off the machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhargav Vadgama" }]
keywords = ["email", "triage", "local-first", "privacy", "imap", "job-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = [
  "pydantic>=2.13.5",
  "PyYAML>=6.0.3",
  "openpyxl>=3.1.5",
  # Passwords for accounts added in the app go to the OS keychain, so it is
  # not optional for anyone using the app. The [keyring] extra stays, empty.
  "keyring>=25.7.0",
  # tomllib joined the standard library in 3.11; this is the same parser for 3.10.
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ml = ["numpy>=2.2.6", "scikit-learn>=1.7.2"]
embeddings = ["sentence-transformers>=6.1.0"]
html = ["selectolax>=1.0.0"]
gmail = ["google-api-python-client>=2.201.0", "google-auth-oauthlib>=1.5.0"]
graph = ["msal>=1.39.0"]
keyring = ["keyring>=25.7.0"]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]
all = [
  "numpy>=2.2.6", "scikit-learn>=1.7.2", "selectolax>=1.0.0",
  "google-api-python-client>=2.201.0", "google-auth-oauthlib>=1.5.0",
  "msal>=1.39.0", "keyring>=25.7.0",
]

[project.scripts]
bmail = "bmail.cli:main"

[project.urls]
Homepage = "https://github.com/GajjarB/Bmail"
Source = "https://github.com/GajjarB/Bmail"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmail = ["packs/builtin/*.yaml", "rules/recipes/*.yaml", "store/*.sql", "ui/static/*", "ui/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so tests can share helpers (`from tests.fake_imap import …`) however
# pytest is started — plain `pytest`, not only `python -m pytest`.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
