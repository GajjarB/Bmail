[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmail"
version = "0.1.0"
description = "Local-first email triage engine: filters, extracts and tracks lifecycle mail without sending anything off the machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhargav Vadgama" }]
keywords = ["email", "triage", "local-first", "privacy", "imap", "job-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  # tomllib joined the standard library in 3.11; this is the same parser for 3.10.
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]
embeddings = ["sentence-transformers>=3.0"]
html = ["selectolax>=0.3"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
graph = ["msal>=1.28"]
keyring = ["keyring>=25.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = [
  "numpy>=1.24", "scikit-learn>=1.3", "selectolax>=0.3",
  "google-api-python-client>=2.100", "google-auth-oauthlib>=1.2",
  "msal>=1.28", "keyring>=25.0",
]

[project.scripts]
bmail = "bmail.cli:main"

[project.urls]
Homepage = "https://github.com/GajjarB/Bmail"
Source = "https://github.com/GajjarB/Bmail"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmail = ["packs/builtin/*.yaml", "rules/recipes/*.yaml", "store/*.sql", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
