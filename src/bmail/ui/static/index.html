<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Bmail</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317191C'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-card">
    <h1>Bmail</h1>
    <p id="boot-msg">Starting the engine…</p>
  </div>
</div>

<div id="shell" hidden>
  <aside class="rail">
    <div class="rail-brand">
      <b>Bmail</b>
      <span id="rail-pack"></span>
    </div>

    <button id="btn-find" class="find">
      <span>Search</span>
      <kbd id="find-key">⌘K</kbd>
    </button>

    <nav class="nav" id="nav"></nav>

    <div class="rail-foot">
      <button id="btn-sync" class="wide">Check for new mail</button>
      <div class="rail-meta" id="rail-meta"></div>
      <button id="btn-keys" class="quiet sm keys-hint">
        <span>Shortcuts</span>
        <kbd>?</kbd>
      </button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="job" class="jobbar" hidden>
  <span class="label" id="job-label"></span>
  <span class="track"><span class="fill" id="job-fill"></span></span>
  <button class="quiet sm" id="job-cancel">Stop</button>
</div>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
