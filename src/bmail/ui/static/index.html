<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Bmail</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">

</head>
<body>

<div id="boot" class="boot">
  <div class="boot-card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Bmail</h1>
    <p id="boot-msg">Starting the engine…</p>
  </div>
</div>

<div id="shell" hidden>
  <aside class="rail">
    <div class="rail-brand">
      <span class="mark" aria-hidden="true"></span>
      <b>Bmail</b>
      <span id="rail-pack"></span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="rail-foot">
      <a class="account-card" href="#/setup" id="account-card">
        <span class="avatar" id="account-avatar" aria-hidden="true"></span>
        <span class="account-who">
          <b id="account-name"></b>
          <span id="account-address"></span>
        </span>
      </a>
      <div class="rail-meta" id="rail-meta"></div>
      <button id="btn-keys" class="quiet sm keys-hint">
        <span>Shortcuts</span>
        <kbd>?</kbd>
      </button>
    </div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <div class="sync-line" id="sync-line" role="status" hidden></div>
      <button id="btn-find" class="find">
        <span>Search mail and applications</span>
        <kbd id="find-key">⌘K</kbd>
      </button>
      <button id="btn-sync" class="primary sync-btn"><span>Check for new mail</span></button>
    </header>
    <main class="main" id="main"></main>
  </section>
</div>

<div id="job" class="jobbar" hidden>
  <span class="label" id="job-label"></span>
  <span class="track"><span class="fill" id="job-fill"></span></span>
  <button class="quiet sm" id="job-cancel">Stop</button>
</div>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
