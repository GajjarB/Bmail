# Bulk and housekeeping mail. These exist so obviously-uninteresting messages
# never reach the classifier, let alone a model.

- id: job-board-digest
  vendor: generic
  description: >-
    A job board's alert mailbox. A digest quotes thirty job adverts, and between
    them they contain every phrase an outcome recipe listens for ("Online-Test",
    "bitte senden Sie Ihre Unterlagen", "we would like to invite you"). Whatever
    it quotes, mail from the alert mailbox is an alert, so this outranks them all.
  category: job_alert
  priority: 96
  match:
    from_addr_regex: 'job-?alerts?|jobagent|jobs-listings|^alerts?@.*(?:job|career|karriere)|@alerts?\..*(?:job|career|karriere)'

# Mail that talks about an application or an interview is never housekeeping,
# whatever else it says: these recipes stand aside for it.
- id: security-notice
  vendor: generic
  category: admin
  priority: 68
  match:
    body_any:
      - "your password was changed"
      - "new sign-in to your account"
      - "verify your email address"
      - "two-factor authentication"
      - "security alert"
      - "app password created"
      - "passkey"
      - "verification code"
      - "enter the code below"
      - "your code is"
      - "one-time code"
      - "sign in with google"
      - "shared some google account data"
      - "ihr passwort wurde geändert"
      - "neue anmeldung bei ihrem konto"
      - "bestätigen sie ihre e-mail-adresse"
      - "sicherheitswarnung"
      - "bestätigungscode"
      - "ihr code lautet"
    body_none: &about_a_job
      - "bewerbung"
      - "vorstellungsgespräch"
      - "interview"
      - "your application to"
      - "application process"
      - "recruit"

- id: account-transaction
  vendor: generic
  description: >-
    What a bank, a shop, a carrier or an office sends: a customer, order,
    contract or case number, a booking, a parcel, a statement. Housekeeping,
    however much of it says "application", "leider" or "unfortunately".
  category: admin
  priority: 66
  match:
    body_any:
      - "dear customer"
      - "dear investor"
      - "dear shareholder"
      - "online banking"
      - "neues dokument in ihrem"
      - "folio"
      - "credit card application"
      - "kundennummer"
      - "vertragsnummer"
      - "bestellnummer"
      - "order number"
      - "your order"
      - "ihre bestellung"
      - "vielen dank für ihre bestellung"
      - "ihr auftrag"
      - "tracking number"
      - "sendungsnummer"
      - "ihre sendung"
      - "your booking"
      - "your reservation"
      - "booking number"
      - "buchungsnummer"
      - "ihre buchung"
      - "justificatif d'achat"
      - "purchase receipt"
      - "your case number"
      - "fallnummer"
      - "registered office"
    body_none: *about_a_job

- id: invoice-receipt
  vendor: generic
  category: admin
  priority: 66
  match:
    body_any:
      - "your receipt from"
      - "your invoice is ready"
      - "payment receipt"
      - "ihre rechnung steht zum download bereit"
      - "zahlungsbestätigung"

- id: newsletter-unsubscribe-footer
  vendor: generic
  description: Fires only together with the List-Unsubscribe header, so real mail is safe.
  category: newsletter
  priority: 40
  confidence: 0.9
  match:
    header_any:
      list-unsubscribe: "http"
    body_any:
      - "unsubscribe"
      - "abmelden"
      - "newsletter abbestellen"
      - "manage your preferences"
      - "view this email in your browser"

- id: job-offer-roundmail
  vendor: generic
  description: >-
    An agency or a job board mailing openings to everyone on its list, often
    from a person's own address and without a list header.
  category: job_alert
  priority: 45
  match:
    body_any:
      - "rundmail an unseren gesamten bewerberpool"
      - "an unseren gesamten bewerberpool"
      - "neues stellenangebot"
      - "neue stellenangebote"
      - "new job openings"
      - "the following jobs matched your search"
      - "jobs matched your search agent"
