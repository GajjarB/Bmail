# German-market job mail. This is where the German corpus actually lives:
# Personio, softgarden, StepStone, Xing and the standard "Leider …" phrasing.
#
# German rejections are polite and indirect, which is exactly the case where a
# small model trained mostly on English degrades. Handling them with a rule is
# both cheaper and more reliable.

- id: personio-acknowledgement
  vendor: Personio
  category: acknowledgement
  priority: 70
  match:
    from_domain: [personio.de, personio.com, jobs.personio.de]
    body_any:
      - "vielen dank für ihre bewerbung"
      - "wir haben ihre bewerbung erhalten"
      - "thank you for your application"
  extract:
    org: {source: from_name, transform: [strip_via, strip, collapse]}
    role:
      source: subject
      regex: "(?:bewerbung|application)\\s*(?:als|für|for|auf)\\s*(.{3,80})$"
      transform: [strip_org_suffix, strip, collapse]

- id: softgarden-acknowledgement
  vendor: softgarden
  category: acknowledgement
  priority: 70
  match:
    from_domain: [softgarden.de, softgarden.io, sgtalent.de]
    body_any:
      - "vielen dank für ihre bewerbung"
      - "ihre bewerbung ist bei uns eingegangen"
      - "thank you for applying"
      - "thank you for your application"
      - "we have received your application"
  extract:
    org: {source: from_name, transform: [strip_via, strip, collapse]}
    role:
      source: subject
      regex: "(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|application\\s+(?:for|to)|applying\\s+(?:for|to)|assessment\\s+for|position\\s+of|invitation\\s*[–—-]|application\\s*[–—-]|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(?:the\\s+)?(.{2,80}?)(?:\\s+(?:bei|at)\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: stepstone-application
  vendor: StepStone
  category: acknowledgement
  priority: 74
  match:
    from_domain: [stepstone.de, stepstone.com]
    subject_any: ["bewerbung", "ihre bewerbung", "application"]
  extract:
    org:
      source: subject
      regex: "(?:bei|an|at)\\s+(.{2,60})$"
      transform: [strip, collapse]
    role:
      source: subject
      regex: "(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|application\\s+(?:for|to)|applying\\s+(?:for|to)|assessment\\s+for|position\\s+of|invitation\\s*[–—-]|application\\s*[–—-]|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(?:the\\s+)?(.{2,80}?)(?:\\s+(?:bei|at)\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: stepstone-job-alert
  vendor: StepStone
  category: job_alert
  priority: 76
  match:
    from_domain: [stepstone.de, stepstone.com]
    subject_any: ["jobs für sie", "neue jobs", "jobagent", "stellenangebote"]

- id: xing-job-alert
  vendor: XING
  category: job_alert
  priority: 75
  match:
    from_domain: [xing.com, xing.de]
    subject_any: ["jobs", "stellenangebote", "jobempfehlungen"]

- id: arbeitsagentur-notice
  vendor: Bundesagentur für Arbeit
  category: admin
  priority: 72
  match:
    from_domain: [arbeitsagentur.de]

- id: join-acknowledgement
  vendor: JOIN
  category: acknowledgement
  priority: 70
  match:
    from_domain: [join.com]
    body_any: ["vielen dank für ihre bewerbung", "thank you for your application"]
  extract:
    org: {source: from_name, transform: [strip_via, strip, collapse]}
    role:
      source: subject
      regex: "(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|application\\s+(?:for|to)|applying\\s+(?:for|to)|assessment\\s+for|position\\s+of|invitation\\s*[–—-]|application\\s*[–—-]|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(?:the\\s+)?(.{2,80}?)(?:\\s+(?:bei|at)\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: generic-rejection-de
  vendor: generic
  description: The standard German rejection formula, in its common variants.
  category: rejection
  priority: 90
  match:
    body_any:
      - "leider müssen wir ihnen mitteilen"
      - "leider können wir ihre bewerbung nicht"
      - "haben wir uns für einen anderen bewerber"
      - "haben wir uns für eine andere bewerberin"
      - "können wir ihre bewerbung nicht weiter berücksichtigen"
      - "nicht in die engere auswahl"
      - "eine absage erteilen"
      - "ihre bewerbung nicht berücksichtigen"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(.{2,80}?)(?:\\s+bei\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: generic-interview-invite-de
  vendor: generic
  category: interview_invite
  priority: 88
  match:
    body_any:
      - "zu einem vorstellungsgespräch einladen"
      - "möchten wir sie gerne kennenlernen"
      - "laden wir sie zu einem gespräch ein"
      - "würden wir uns gerne mit ihnen unterhalten"
      - "terminvorschlag für ein gespräch"
    # An acknowledgement that mentions an interview that may come is not an
    # invitation.
    body_none:
      - "sollte ihr profil"
      - "falls ihr profil"
      - "sofern ihr profil"
      - "wenn ihr profil"
      - "sollten ihre qualifikationen"
      - "in die engere auswahl"
      - "gegebenenfalls zu einem"
      - "ggf. zu einem"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(.{2,80}?)(?:\\s+bei\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: generic-interview-invite-phrased-de
  vendor: generic
  description: >-
    "Gerne laden wir Sie zu einem persönlichen Gespräch ein", "wir freuen uns,
    Sie zu einem ersten Kennenlernen einzuladen": you, a meeting and an
    invitation, within one sentence.
  category: interview_invite
  priority: 88
  match:
    body_regex: '\bsie\b(?:(?!\. )[^!?]){0,40}?\bzu\b(?:(?!\. )[^!?]){0,30}?(?:gespr(?:ä|ae)ch|interview|kennenlernen|kennenlerntermin)\w*(?:(?!\. )[^!?]){0,20}?\b(?:einladen|einzuladen)\b|\blad(?:en|e) (?:wir|ich) sie\b(?:(?!\. )[^!?]){0,50}?(?:gespr(?:ä|ae)ch|interview|kennenlernen)\w*(?:(?!\. )[^!?]){0,25}?\bein\b'
    # An acknowledgement that mentions an interview that may come is not an
    # invitation.
    body_none:
      - "sollte ihr profil"
      - "falls ihr profil"
      - "sofern ihr profil"
      - "wenn ihr profil"
      - "sollten ihre qualifikationen"
      - "in die engere auswahl"
      - "gegebenenfalls zu einem"
      - "ggf. zu einem"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(.{2,80}?)(?:\\s+bei\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: generic-document-request-de
  vendor: generic
  category: document_request
  priority: 84
  match:
    body_any:
      - "bitte reichen sie noch"
      - "es fehlen noch folgende unterlagen"
      - "wir benötigen noch"
      - "bitte laden sie folgende dokumente hoch"
      - "ihre bewerbung ist unvollständig"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(.{2,80}?)(?:\\s+bei\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: generic-document-request-phrased-de
  vendor: generic
  description: >-
    "Bitte senden Sie uns bis zum 30.09. Ihre Zeugnisse", "Bitte Ihre Zeugnisse
    noch hochladen": please, a verb of sending and the documents, close
    together. The window allows full stops, because German dates contain them.
  category: document_request
  priority: 84
  match:
    body_regex: '\bbitte\b[^!?]{0,30}?\b(?:senden|schicken|reichen|übermitteln|übersenden|laden|lassen)\b[^!?]{0,60}?(?:zeugnis|unterlagen|dokumente|nachweis|lebenslauf|zertifikat|urkunde)|\bbitte\b[^!?]{0,40}?(?:zeugnis|unterlagen|dokumente|nachweis|lebenslauf|zertifikat|urkunde)\w*[^!?]{0,40}?\b(?:senden|schicken|nachreichen|zukommen|hochladen|übermitteln|übersenden)'
    body_none:
      - "keine unterlagen"
      - "keine weiteren unterlagen"
      - "keine dokumente"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:bewerbung\\s*(?:als|f(?:ü|ue)r|:)|vorstellungsgespr(?:ä|ae)ch\\s*[–—-]|gespr(?:ä|ae)ch\\s*[–—-]|stelle\\s+als)\\s*(.{2,80}?)(?:\\s+bei\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

