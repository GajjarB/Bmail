# Applicant tracking systems, English templates.
#
# Priority policy — this is the part that matters when several recipes match.
# An "acknowledgement" is the weakest claim a recipe can make: every ATS opens
# every mail with "thank you for your interest", including its rejections. So
# outcome recipes (offer, rejection, interview, assessment, documents) are
# ranked ABOVE vendor acknowledgement recipes, and vendor acknowledgements are
# the fallback when no outcome phrase is present.
#
#   92 offer / admission      88 interview invite     84 document request
#   90 rejection              86 assessment           70 vendor acknowledgement
#
# These are starter recipes written against the boilerplate these systems are
# widely known to send. Treat them as a baseline: run `bmail templates check`
# against your own corpus and tighten the matchers before trusting a recipe on
# real mail. A recipe that misfires is worse than no recipe.

- id: greenhouse-acknowledgement
  vendor: Greenhouse
  category: acknowledgement
  priority: 70
  match:
    from_domain: [greenhouse.io, us.greenhouse-mail.io, greenhouse-mail.io]
    body_any:
      - "thank you for applying"
      - "thanks for applying"
      - "we have received your application"
  extract:
    org:
      source: body
      regex: "(?:applying (?:to|at)|your (?:interest in|application to))\\s+([A-Z][\\w&'’-]*(?:\\s+[A-Z][\\w&'’-]*){0,3})"
      transform: [strip, collapse]
    role:
      source: subject
      regex: "(?:application|applying)\\s+(?:for|to)\\s+(?:the\\s+)?(.{3,80}?)(?:\\s+at\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

- id: lever-acknowledgement
  vendor: Lever
  category: acknowledgement
  priority: 70
  match:
    from_domain: [lever.co, hire.lever.co]
    body_any:
      - "thank you for your interest"
      - "we have received your application"
      - "thanks for applying"
  extract:
    org:
      source: from_name
      transform: [strip_via, strip, collapse]
    role:
      source: subject
      regex: "(?:for|to)\\s+(?:the\\s+)?(.{3,80}?)\\s*(?:position|role)?$"
      transform: [strip_org_suffix, strip, collapse]

