- id: generic-acknowledgement-en
  vendor: generic
  description: >
    The English counterpart of generic-acknowledgement-de. Without it, a company
    that sends its own acknowledgement from its own domain — rather than through
    a named ATS — matches nothing and falls through to the classifier.
  category: acknowledgement
  priority: 50
  match:
    body_any:
      - "thank you for applying"
      - "thanks for applying"
      - "we have received your application"
      - "your application has been received"
      - "we confirm receipt of your application"
    body_none:
      - "we have decided not to move forward"
      - "we will not be moving forward"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:application\\s+(?:for|to)|assessment\\s+for|invitation\\s*[–—-]|application\\s*[–—-]|position\\s+of)\\s+(?:the\\s+)?(.{2,80}?)(?:\\s+at\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]
