- id: generic-rejection-en
  vendor: generic
  description: Rejection wording that is near-universal across English ATS mail.
  category: rejection
  priority: 90
  match:
    body_any:
      - "we have decided not to move forward"
      - "we will not be moving forward"
      - "decided to move forward with other candidates"
      - "we have decided to pursue other candidates"
      - "your application was not successful"
      - "we regret to inform you that we will not"
      - "unfortunately, we have decided not to"
  extract:
    org: {source: from_domain, transform: [domain_to_org]}
    role:
      source: subject
      regex: "(?i)(?:application\\s+(?:for|to)|assessment\\s+for|invitation\\s*[–—-]|application\\s*[–—-]|position\\s+of)\\s+(?:the\\s+)?(.{2,80}?)(?:\\s+at\\s+.+)?$"
      transform: [strip_org_suffix, strip, collapse]

