<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sift</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%89%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-inner">
    <h1>Sift</h1>
    <p id="boot-msg">Connecting…</p>
  </div>
</div>

<div id="shell" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◧</span>
      <strong>Sift</strong>
      <span class="muted" id="pack-label"></span>
    </div>
    <nav class="tabs" role="tablist">
      <a href="#/brief"    data-tab="brief"    role="tab">Brief</a>
      <a href="#/cases"    data-tab="cases"    role="tab">Cases</a>
      <a href="#/messages" data-tab="messages" role="tab">Messages</a>
      <a href="#/review"   data-tab="review"   role="tab">Review <span id="review-count" class="pill" hidden></span></a>
      <a href="#/settings" data-tab="settings" role="tab">Settings</a>
    </nav>
    <div class="actions">
      <button id="btn-triage" class="primary">Triage</button>
      <button id="btn-refresh" title="Reload data (r)">↻</button>
    </div>
  </header>

  <div id="job" class="jobbar" hidden>
    <div class="jobbar-text"><strong id="job-kind"></strong> <span id="job-step" class="muted"></span></div>
    <div class="bar"><div id="job-fill" class="fill"></div></div>
    <button id="job-cancel" class="ghost">Cancel</button>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <main id="view" class="view"></main>

  <footer class="statusbar">
    <span id="status-store" class="muted"></span>
    <span id="status-llm" class="muted"></span>
    <span class="muted grow"></span>
    <span class="muted">Nothing leaves this machine</span>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
