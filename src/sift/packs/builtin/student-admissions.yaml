# University admissions, written for the international-applicant reality:
# eight to fifteen programmes in parallel, each with hard deadlines, a portal,
# and non-obvious document requests (VPD, APS, blocked account, translations).
name: student-admissions
description: University and programme applications, deadlines and document requests.
language: [en, de]
entity: programme_application
key: [org_domain, role]
initial_state: enquiry
states:
  - enquiry
  - submitted
  - docs_requested
  - under_review
  - interview
  - admitted
  - waitlist
  - rejected
  - enrolled
  - withdrawn
  - ghosted
terminal_states: [admitted, rejected, enrolled, withdrawn]
stall_days: 30

transitions:
  ghosted:
    from: [submitted, docs_requested, under_review, interview]
    after_days_silent: 30

categories:
  acknowledgement:
    description: Confirmation that an application or document upload was received.
    state: submitted
    opens_case: true
    label: Submitted
    prototypes:
      - "We confirm receipt of your application for the Master's programme."
      - "Wir bestätigen den Eingang Ihrer Bewerbung für den Masterstudiengang."
      - "Your application has been forwarded to the admissions committee."

  document_request:
    description: A request for certificates, translations, VPD, APS, transcripts or proof of language.
    action_required: true
    urgency: this_week
    next_action: submit_document
    high_stakes: true
    state: docs_requested
    label: Documents
    prototypes:
      - "Your application is incomplete. Please upload your certified transcript and language certificate."
      - "Bitte reichen Sie die VPD von uni-assist sowie eine beglaubigte Übersetzung nach."
      - "We still require the APS certificate before your application can be processed."

  deadline_notice:
    description: A reminder that an application, enrolment or payment deadline is approaching.
    action_required: true
    urgency: this_week
    next_action: submit_document
    high_stakes: true
    label: Deadline
    prototypes:
      - "The application deadline for the winter semester is 15 July. Applications after this date cannot be considered."
      - "Die Bewerbungsfrist für das Wintersemester endet am 15. Juli."

  admission_offer:
    description: An admission or acceptance letter for a programme.
    action_required: true
    urgency: today
    next_action: reply
    high_stakes: true
    state: admitted
    closes_case: true
    label: Admitted
    prototypes:
      - "We are pleased to inform you that you have been admitted to the programme."
      - "Wir freuen uns, Ihnen mitteilen zu können, dass Sie einen Studienplatz erhalten haben."

  waitlist:
    description: Placed on a waiting list or ranked but not yet admitted.
    state: waitlist
    label: Waitlist
    prototypes:
      - "You have been placed on the waiting list with rank 34."
      - "Sie stehen auf der Warteliste. Ihr Rangplatz ist 34."

  rejection:
    description: The application was declined.
    state: rejected
    closes_case: true
    label: Rejected
    prototypes:
      - "We regret to inform you that we cannot offer you a place in this programme."
      - "Leider können wir Ihnen keinen Studienplatz anbieten."

  interview_invite:
    description: An invitation to an admissions interview, aptitude test or selection procedure.
    action_required: true
    urgency: this_week
    next_action: schedule
    high_stakes: true
    state: interview
    label: Interview
    prototypes:
      - "You are invited to an online selection interview. Please book a slot."
      - "Wir laden Sie zum Auswahlgespräch ein. Bitte wählen Sie einen Termin."

  enrolment:
    description: Enrolment, matriculation, semester fee or registration instructions.
    action_required: true
    urgency: this_week
    next_action: submit_document
    high_stakes: true
    state: enrolled
    label: Enrolment
    prototypes:
      - "To complete your enrolment, transfer the semester contribution and upload your health insurance certificate."
      - "Zur Immatrikulation überweisen Sie bitte den Semesterbeitrag und laden Sie die Krankenversicherungsbescheinigung hoch."

  portal_notice:
    description: A portal notification telling you the real message is behind a login.
    action_required: true
    urgency: this_week
    next_action: reply
    label: Portal
    prototypes:
      - "There is a new message in your application portal. Please log in to read it."
      - "Es liegt eine neue Nachricht in Ihrem Bewerbungsportal für Sie bereit."

  newsletter:
    description: University marketing, open-day invitations or general mailing lists.
    label: Bulk
    prototypes:
      - "Join our virtual open day and learn about student life on campus."
      - "Newsletter der Studienberatung mit Terminen und Veranstaltungen."

  admin:
    description: Account, password, fee or IT housekeeping mail from the institution.
    label: Admin
    prototypes:
      - "Your student account password will expire in seven days."
      - "Ihre Zugangsdaten für das Campus-Management-System."

  personal:
    description: A message written personally by a professor, coordinator or fellow applicant.
    action_required: true
    urgency: whenever
    next_action: reply
    label: Personal
    prototypes:
      - "Thanks for your email — happy to supervise your thesis, let us talk next week."
      - "Vielen Dank für Ihre Nachricht, gerne können wir nächste Woche sprechen."

  other:
    description: Anything that does not fit the categories above.

kpis: [admission_rate, docs_outstanding, deadlines_next_30d, stalled_count]
label_prefix: Sift
